[project]
name = "blend-punch-os"
version = "0.1.0"
description = "BLEND PUNCH Internal Operations System"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
    "anthropic>=0.40.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "bcrypt>=4.0.0",
    "python-jose[cryptography]>=3.3.0",
    "openpyxl>=3.1.0",
    "gspread>=6.2.0",
    "google-auth>=2.53.0",
    "instagrapi>=2.1.0",   # 인플루언서 프로필 자동수집 (비공식 API — 소량씩만 사용)
    "apscheduler>=3.10.0",
    "Pillow>=10.0.0",
    "boto3>=1.34.0",
    # 아래 3개는 WSL·EC2 venv 에 수동 설치돼 있어 선언이 빠져 있던 것 (새 환경에서 uv sync 로 드러남)
    "slowapi>=0.1.9",            # app/main.py 요청 제한 — 없으면 앱 기동 불가
    "psycopg2-binary>=2.9.0",    # PostgreSQL(RDS) 드라이버
    "xlrd>=2.0.0",               # 소싱 .xls 업로드 (app/routers/sourcing.py)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
