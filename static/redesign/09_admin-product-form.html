<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>관리자 상품등록 시안 · BLEND PICK</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<style>body{font-family:'Pretendard',sans-serif;}
  .fld{width:100%;padding:.65rem .85rem;border:1px solid rgba(0,0,0,.1);border-radius:.7rem;font-size:14px;}
  .lbl{font-size:13px;font-weight:600;color:rgba(0,0,0,.6);margin-bottom:.35rem;display:block;}
  .sect{font-size:13px;font-weight:800;color:rgba(0,0,0,.5);margin-bottom:1rem;}</style>
<script>tailwind.config={theme:{extend:{colors:{brand:{DEFAULT:'#2f5d3f',dark:'#244a32',light:'#e7f0ea'},accent:'#ff7a1a',ink:'#1b1f1d'}}}}</script>
</head>
<!-- 시안 09 — 관리자 상품 등록 폼 -->
<body class="bg-[#f4f5f7] text-ink">
<div class="flex min-h-screen">
  <aside class="w-56 bg-white border-r border-black/5 flex flex-col shrink-0">
    <div class="px-5 py-5 border-b border-black/5"><p class="text-[11px] text-black/40 font-semibold">BLEND PICK</p><p class="font-extrabold text-lg">Admin</p></div>
    <nav class="p-3 space-y-1 text-[14px]">
      <a href="07_admin-dashboard.html" class="flex gap-3 px-3 py-2.5 rounded-lg text-black/60 hover:bg-black/5">📊 대시보드</a>
      <a href="08_admin-products.html" class="flex gap-3 px-3 py-2.5 rounded-lg bg-brand-light text-brand font-bold border-l-2 border-brand">📦 상품 관리</a>
      <a href="10_admin-orders.html" class="flex gap-3 px-3 py-2.5 rounded-lg text-black/60 hover:bg-black/5">🧾 판매 관리</a>
      <a href="11_admin-shipping.html" class="flex gap-3 px-3 py-2.5 rounded-lg text-black/60 hover:bg-black/5">🚚 배송 관리</a>
      <a href="12_admin-settlement.html" class="flex gap-3 px-3 py-2.5 rounded-lg text-black/60 hover:bg-black/5">💰 정산 관리</a>
      <a href="#" class="flex gap-3 px-3 py-2.5 rounded-lg text-black/60 hover:bg-black/5">⭐ 리뷰 관리</a>
    </nav>
  </aside>

  <main class="flex-1 p-8 max-w-3xl" x-data="{sale:'상시 판매'}">
    <h1 class="text-2xl font-extrabold">상품 등록</h1>
    <p class="text-[13px] text-black/45 mt-1">새 상품을 등록해요</p>

    <!-- 기본 정보 -->
    <section class="bg-white rounded-2xl border border-black/5 p-6 mt-6">
      <p class="sect">기본 정보</p>
      <label class="lbl">상품명 *</label><input class="fld mb-4" placeholder="상품명을 입력하세요">
      <div class="grid grid-cols-2 gap-4">
        <div><label class="lbl">브랜드</label><input class="fld"></div>
        <div><label class="lbl">카테고리</label><select class="fld"><option>카테고리 선택</option></select></div>
        <div><label class="lbl">제조사</label><input class="fld" placeholder="제조사명"></div>
        <div><label class="lbl">원산지</label><input class="fld" placeholder="예: 대한민국"></div>
        <div><label class="lbl">상품 상태</label><select class="fld"><option>신상품</option></select></div>
        <div><label class="lbl">제조일자</label><input type="date" class="fld"></div>
      </div>
    </section>

    <!-- 판매 상태 -->
    <section class="bg-white rounded-2xl border border-black/5 p-6 mt-5">
      <p class="sect">판매 상태</p>
      <div class="grid grid-cols-2 gap-3">
        <template x-for="s in [['상시 판매','전시 상품'],['공동구매','비전시 상품'],['준비중','공개'],['품절','']]" :key="s[0]">
          <button @click="sale=s[0]" class="text-left px-4 py-3 rounded-xl border transition"
            :class="sale===s[0]?'border-accent bg-accent/5':'border-black/10'">
            <p class="font-bold text-[14px]" :class="sale===s[0]?'text-accent':''" x-text="s[0]"></p>
            <p class="text-[12px] text-black/45" x-text="s[1]"></p></button>
        </template>
      </div>
      <label class="flex items-center justify-between mt-4 text-[14px]">
        <span><b>예약구매</b> <span class="text-[12px] text-black/45 ml-1">판매 전 사전 예약을 받습니다</span></span>
        <span class="w-10 h-6 rounded-full bg-black/15 relative"><span class="absolute top-0.5 left-0.5 w-5 h-5 rounded-full bg-white"></span></span>
      </label>
    </section>

    <!-- 이미지 -->
    <section class="bg-white rounded-2xl border border-black/5 p-6 mt-5">
      <p class="sect">이미지</p>
      <label class="lbl">대표 이미지</label>
      <div class="border-2 border-dashed border-black/15 rounded-xl aspect-video flex flex-col items-center justify-center text-black/30 text-sm">
        <span class="text-3xl">+</span>클릭·파일업로드·붙여넣기(Ctrl+V)</div>
      <input class="fld mt-2" placeholder="URL 입력 또는 이미지 붙여넣기(Ctrl+V)">
      <label class="lbl mt-4">서브 이미지 (최대 4장)</label>
      <div class="grid grid-cols-4 gap-2">
        <template x-for="i in 4"><div class="border-2 border-dashed border-black/15 rounded-xl aspect-square flex items-center justify-center text-black/25 text-2xl">+</div></template>
      </div>
    </section>

    <!-- 판매가 -->
    <section class="bg-white rounded-2xl border border-black/5 p-6 mt-5">
      <p class="sect">판매가</p>
      <div class="grid grid-cols-2 gap-4">
        <div><label class="lbl">소비자가 (정가)</label><input class="fld" value="0"></div>
        <div><label class="lbl">할인율 (%)</label><input class="fld" value="0"></div>
        <div><label class="lbl">판매가 *</label><input class="fld" value="0"></div>
        <div><label class="lbl">즉시할인가</label><input class="fld" placeholder="미입력 시 미적용"></div>
        <div><label class="lbl">판매 시작일시</label><input type="datetime-local" class="fld"></div>
        <div><label class="lbl">판매 종료일시</label><input type="datetime-local" class="fld"></div>
      </div>
    </section>

    <!-- 배송 -->
    <section class="bg-white rounded-2xl border border-black/5 p-6 mt-5">
      <p class="sect">배송</p>
      <div class="grid grid-cols-2 gap-4">
        <div><label class="lbl">택배사</label><select class="fld"><option>CJ대한통운</option></select></div>
        <div><label class="lbl">배송비 설정</label><select class="fld"><option>유료배송</option></select></div>
        <div><label class="lbl">배송비 (원)</label><input class="fld" value="3000"></div>
        <div><label class="lbl">제주/도서산간 추가 (원)</label><input class="fld" value="0"></div>
      </div>
      <div class="mt-4"><label class="lbl">출고지 주소</label><input class="fld" placeholder="위탁배송 출고지 주소 (브랜드사 주소)"></div>
    </section>

    <!-- 반품&교환 + A/S -->
    <section class="bg-white rounded-2xl border border-black/5 p-6 mt-5">
      <p class="sect">반품 & 교환</p>
      <div class="grid grid-cols-2 gap-4">
        <div><label class="lbl">반품 비용 — 편도 (원)</label><input class="fld" value="0"></div>
        <div><label class="lbl">반품 비용 — 왕복 (원)</label><input class="fld" value="0"></div>
        <div><label class="lbl">교환 비용 — 편도 (원)</label><input class="fld" value="0"></div>
        <div><label class="lbl">교환 비용 — 왕복 (원)</label><input class="fld" value="0"></div>
      </div>
      <div class="mt-4"><label class="lbl">A/S 특이사항</label><textarea class="fld h-24" placeholder="A/S 관련 특이사항을 입력하세요"></textarea></div>
    </section>

    <div class="flex justify-end gap-2 mt-6 pb-10">
      <button class="px-6 py-3 rounded-xl border border-black/10 bg-white font-bold text-[14px]">취소</button>
      <button class="px-6 py-3 rounded-xl bg-brand text-white font-bold text-[14px]">상품 등록</button>
    </div>
  </main>
</div>
</body>
</html>
