<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>H03 호텔 결제 · BLEND PICK</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<style>body{font-family:'Pretendard',sans-serif;}</style>
<script>tailwind.config={theme:{extend:{colors:{brand:{DEFAULT:'#2f5d3f',dark:'#244a32',light:'#e7f0ea'},accent:'#ff7a1a',ink:'#1b1f1d',paper:'#faf9f5'}}}}</script>
</head>
<!-- H03 — 호텔 예약 결제 : 기존 결제 디자인과 동일 톤, 내용만 예약형 -->
<body class="bg-paper text-ink">
<div class="mx-auto max-w-[440px] bg-white min-h-screen shadow-sm relative pb-32" x-data="{pay:'card',agree:false}">
  <header class="sticky top-0 z-30 flex items-center gap-2 px-4 h-12 bg-white/95 backdrop-blur border-b border-black/5">
    <a href="h02_booking.html" class="text-xl leading-none">‹</a><span class="font-bold">예약 / 결제</span>
  </header>

  <!-- 예약 요약 -->
  <section class="px-4 py-4 border-b-8 border-neutral-100">
    <div class="flex gap-3">
      <img src="https://images.unsplash.com/photo-1566073771259-6a8506099945?w=300" class="w-20 h-20 rounded-lg object-cover">
      <div class="text-[13px]"><p class="text-black/50">5성급 · 제주 서귀포</p><p class="font-bold">그랜드 오션 리조트 제주</p><p class="text-black/55 mt-0.5">디럭스 오션뷰</p></div>
    </div>
    <div class="mt-4 grid grid-cols-3 rounded-xl bg-neutral-50 border border-black/5 divide-x divide-black/5 text-center text-[13px]">
      <div class="py-3"><p class="text-black/45 text-[11px]">체크인</p><p class="font-bold">8/1 (금)</p><p class="text-[11px] text-black/45">15:00</p></div>
      <div class="py-3"><p class="text-black/45 text-[11px]">체크아웃</p><p class="font-bold">8/3 (일)</p><p class="text-[11px] text-black/45">11:00</p></div>
      <div class="py-3"><p class="text-black/45 text-[11px]">인원</p><p class="font-bold">성인 2</p><p class="text-[11px] text-black/45">2박</p></div>
    </div>
  </section>

  <!-- 예약자 정보 -->
  <section class="px-4 py-4 border-b-8 border-neutral-100">
    <p class="text-[13px] font-extrabold mb-3">예약자 정보</p>
    <div class="space-y-2">
      <input class="w-full px-3.5 py-3 rounded-xl border border-black/10 text-[14px]" placeholder="예약자 성함">
      <input class="w-full px-3.5 py-3 rounded-xl border border-black/10 text-[14px]" placeholder="연락처">
      <input class="w-full px-3.5 py-3 rounded-xl border border-black/10 text-[14px]" placeholder="요청사항 (선택) — 예: 고층 요청">
    </div>
  </section>

  <!-- 결제수단 -->
  <section class="px-4 py-4 border-b-8 border-neutral-100">
    <p class="text-[13px] font-extrabold mb-3">결제 수단</p>
    <div class="grid grid-cols-3 gap-2">
      <template x-for="m in [{k:'card',t:'카드'},{k:'kakao',t:'카카오페이'},{k:'toss',t:'토스페이'}]" :key="m.k">
        <button @click="pay=m.k" class="py-3 rounded-xl border text-[13px] font-semibold" :class="pay===m.k?'border-brand bg-brand-light':'border-black/10 text-black/60'" x-text="m.t"></button>
      </template>
    </div>
  </section>

  <!-- 요금 상세 (날짜별) -->
  <section class="px-4 py-4">
    <p class="text-[13px] font-extrabold mb-3">요금 상세</p>
    <div class="space-y-2 text-[13px]">
      <div class="flex justify-between"><span class="text-black/55">8/1 (금) 1박</span><span>129,000원</span></div>
      <div class="flex justify-between"><span class="text-black/55">8/2 (토) 1박</span><span>149,000원</span></div>
      <div class="flex justify-between text-brand"><span>공구 할인</span><span>-20,000원</span></div>
      <div class="flex justify-between pt-2 border-t border-black/10 text-[16px] font-extrabold"><span>총 결제금액</span><span class="text-brand">258,000원</span></div>
    </div>
  </section>

  <div class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[440px] bg-white border-t border-black/10 px-4 py-3">
    <label class="flex items-center gap-2 mb-2.5 text-[12px] text-black/60"><input type="checkbox" x-model="agree" class="w-4 h-4 accent-[#2f5d3f]">예약 내용·취소규정을 확인했으며 결제에 동의합니다</label>
    <button class="w-full py-3.5 rounded-xl bg-brand text-white font-bold text-[15px] disabled:opacity-40" :disabled="!agree">258,000원 결제하기</button>
  </div>
</div>
</body>
</html>
