<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>H02 예약 스텝퍼 · BLEND PICK</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<style>body{font-family:'Pretendard',sans-serif;}[x-cloak]{display:none;}</style>
<script>tailwind.config={theme:{extend:{colors:{brand:{DEFAULT:'#2f5d3f',dark:'#244a32',light:'#e7f0ea'},accent:'#ff7a1a',ink:'#1b1f1d',paper:'#faf9f5'}}}}</script>
</head>
<!-- H02 — 예약 스텝퍼(바텀시트): ①날짜 ②객실 ③인원. 상단에 진행 단계 표시 -->
<body class="bg-black/40">
<div class="mx-auto max-w-[440px] min-h-screen bg-white relative"
     x-data="{step:1, ci:null, co:null, room:null, adult:2, child:0,
       rooms:[{n:'디럭스 오션뷰',cap:'기준2·최대3',price:129000,left:3,img:'https://images.unsplash.com/photo-1631049307264-da0ec9d70304?w=300'},
              {n:'프리미어 스위트',cap:'기준2·최대4',price:219000,left:1,img:'https://images.unsplash.com/photo-1618773928121-c32242e63f39?w=300'},
              {n:'스탠다드 트윈',cap:'기준2·최대2',price:99000,left:0,img:'https://images.unsplash.com/photo-1590490360182-c33d57733427?w=300'}]}">

  <!-- 헤더 + 스텝 인디케이터 -->
  <header class="sticky top-0 z-30 bg-white border-b border-black/5">
    <div class="flex items-center gap-2 px-4 h-12">
      <a href="h01_hotel-detail.html" class="text-xl leading-none">‹</a><span class="font-bold">예약하기</span>
    </div>
    <div class="flex px-4 pb-3 gap-2 text-[12px] font-semibold">
      <template x-for="(t,i) in ['날짜','객실','인원']" :key="i">
        <div class="flex-1 text-center py-1.5 rounded-full transition"
          :class="step===i+1?'bg-brand text-white':(step>i+1?'bg-brand-light text-brand':'bg-black/5 text-black/40')">
          <span x-text="(i+1)+'. '+t"></span></div>
      </template>
    </div>
  </header>

  <!-- STEP 1: 날짜 선택 -->
  <div x-show="step===1" class="p-4">
    <p class="text-[14px] font-bold mb-1">투숙 날짜를 선택하세요</p>
    <p class="text-[12px] text-black/50 mb-4">공구 가능 기간 8/1 ~ 8/31 · 날짜별 요금이 달라요</p>
    <div class="text-center font-bold text-[15px] mb-3">2026년 8월</div>
    <div class="grid grid-cols-7 gap-1 text-center text-[11px] text-black/40 mb-1">
      <template x-for="d in ['일','월','화','수','목','금','토']"><div x-text="d"></div></template>
    </div>
    <div class="grid grid-cols-7 gap-1">
      <template x-for="n in 5"><div></div></template>
      <template x-for="d in 31" :key="d">
        <button @click="!ci||co? (ci=d,co=null):(d>ci?co=d:ci=d)"
          class="aspect-square rounded-lg text-[13px] flex flex-col items-center justify-center transition"
          :class="[ (d%7===0?'text-red-400':''),
            (ci===d||co===d)?'bg-brand text-white':((ci&&co&&d>ci&&d<co)?'bg-brand-light text-brand':''),
            (d===13||d===14)?'opacity-30 line-through pointer-events-none':'hover:bg-black/5' ]">
          <span x-text="d"></span>
          <span class="text-[8px]" :class="(ci===d||co===d)?'text-white/80':'text-accent'" x-text="(d===13||d===14)?'마감':(d%3===0?'14.9만':'12.9만')"></span>
        </button>
      </template>
    </div>
    <div class="mt-4 p-3 rounded-xl bg-brand-light/60 text-[13px] text-center" x-show="ci" x-cloak>
      <span x-text="ci?('8/'+ci+(co?(' ~ 8/'+co+'  ('+(co-ci)+'박)'):'  (체크아웃 날짜 선택)')):''"></span>
    </div>
    <button @click="step=2" :disabled="!ci||!co" class="w-full mt-4 py-3.5 rounded-xl bg-brand text-white font-bold disabled:opacity-40">다음: 객실 선택</button>
  </div>

  <!-- STEP 2: 객실 선택 -->
  <div x-show="step===2" x-cloak class="p-4">
    <p class="text-[14px] font-bold mb-1">객실을 선택하세요</p>
    <p class="text-[12px] text-black/50 mb-4"><span x-text="'8/'+ci+' ~ 8/'+co+' · '+(co-ci)+'박'"></span> 기준 요금·잔여</p>
    <div class="space-y-3">
      <template x-for="(r,i) in rooms" :key="i">
        <div class="flex gap-3 p-3 rounded-xl border-2 transition"
          :class="[room===i?'border-brand bg-brand-light/40':'border-black/8', r.left===0?'opacity-45':'']">
          <img :src="r.img" class="w-24 h-24 rounded-lg object-cover">
          <div class="flex-1 text-[13px]">
            <p class="font-bold" x-text="r.n"></p>
            <p class="text-black/50" x-text="r.cap"></p>
            <p class="text-[11px] mt-0.5" :class="r.left===0?'text-red-500 font-bold':(r.left<=2?'text-accent font-bold':'text-black/45')"
               x-text="r.left===0?'매진':('잔여 '+r.left+'실')"></p>
            <div class="flex items-center justify-between mt-1.5">
              <p class="text-brand font-extrabold" x-text="(r.price*(co-ci)).toLocaleString()+'원'"></p>
              <button @click="room=i" :disabled="r.left===0" class="px-4 py-1.5 rounded-lg text-[12px] font-bold"
                :class="room===i?'bg-brand text-white':'border border-brand text-brand'" x-text="room===i?'선택됨':'선택'"></button>
            </div>
          </div>
        </div>
      </template>
    </div>
    <button @click="step=3" :disabled="room===null" class="w-full mt-4 py-3.5 rounded-xl bg-brand text-white font-bold disabled:opacity-40">다음: 인원 선택</button>
  </div>

  <!-- STEP 3: 인원 선택 -->
  <div x-show="step===3" x-cloak class="p-4">
    <p class="text-[14px] font-bold mb-1">투숙 인원을 선택하세요</p>
    <p class="text-[12px] text-black/50 mb-4">기준 인원 초과 시 1인당 20,000원 추가</p>
    <div class="space-y-3">
      <div class="flex items-center justify-between p-4 rounded-xl border border-black/8">
        <div><p class="font-bold text-[14px]">성인</p><p class="text-[12px] text-black/45">만 13세 이상</p></div>
        <div class="flex items-center gap-3"><button @click="adult=Math.max(1,adult-1)" class="w-8 h-8 rounded-lg border border-black/15 text-lg">−</button><span class="w-6 text-center font-bold" x-text="adult"></span><button @click="adult++" class="w-8 h-8 rounded-lg border border-black/15 text-lg">+</button></div>
      </div>
      <div class="flex items-center justify-between p-4 rounded-xl border border-black/8">
        <div><p class="font-bold text-[14px]">아동</p><p class="text-[12px] text-black/45">만 12세 이하</p></div>
        <div class="flex items-center gap-3"><button @click="child=Math.max(0,child-1)" class="w-8 h-8 rounded-lg border border-black/15 text-lg">−</button><span class="w-6 text-center font-bold" x-text="child"></span><button @click="child++" class="w-8 h-8 rounded-lg border border-black/15 text-lg">+</button></div>
      </div>
    </div>
    <!-- 요약 -->
    <div class="mt-5 p-4 rounded-xl bg-brand-light/50 text-[13px] space-y-1">
      <div class="flex justify-between"><span class="text-black/55">객실</span><span class="font-semibold" x-text="rooms[room]?.n"></span></div>
      <div class="flex justify-between"><span class="text-black/55">일정</span><span class="font-semibold" x-text="'8/'+ci+' ~ 8/'+co+' ('+(co-ci)+'박)'"></span></div>
      <div class="flex justify-between"><span class="text-black/55">인원</span><span class="font-semibold" x-text="'성인 '+adult+(child?(', 아동 '+child):'')"></span></div>
      <div class="flex justify-between"><span class="text-black/55" x-text="'객실요금 ('+(co-ci)+'박)'"></span><span x-text="(rooms[room]?.price*(co-ci)).toLocaleString()+'원'"></span></div>
      <div class="flex justify-between" x-show="adult>2" x-cloak><span class="text-black/55">추가 인원 (성인 <span x-text="adult-2"></span>명 · 2만/박)</span><span x-text="'+'+(Math.max(0,adult-2)*20000*(co-ci)).toLocaleString()+'원'"></span></div>
      <div class="flex justify-between pt-1.5 border-t border-brand/20 text-[15px] font-extrabold text-brand"><span>총 금액</span><span x-text="(rooms[room]?.price*(co-ci)+Math.max(0,adult-2)*20000*(co-ci)).toLocaleString()+'원'"></span></div>
    </div>
    <a href="h03_hotel-checkout.html" class="block w-full mt-4 py-3.5 rounded-xl bg-brand text-white font-bold text-center">결제하기</a>
  </div>
</div>
</body>
</html>
