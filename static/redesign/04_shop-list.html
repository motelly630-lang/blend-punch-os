<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>메인샵 목록 시안 · BLEND PICK</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<style>body{font-family:'Pretendard',sans-serif;}</style>
<script>tailwind.config={theme:{extend:{colors:{brand:{DEFAULT:'#2f5d3f',dark:'#244a32',light:'#e7f0ea'},accent:'#ff7a1a',ink:'#1b1f1d',paper:'#faf9f5'}}}}</script>
</head>
<!-- 시안 04 — 메인샵 상품 목록 (/shop) · 직접 유입 고객용 · 반응형 그리드 -->
<body class="bg-paper text-ink">
<div x-data="{cat:'전체'}">
  <!-- 헤더 -->
  <header class="sticky top-0 z-30 bg-white/90 backdrop-blur border-b border-black/5">
    <div class="max-w-6xl mx-auto flex items-center justify-between px-5 h-14">
      <div class="flex items-center gap-8">
        <span class="font-extrabold tracking-tight text-brand text-lg">BLEND<span class="text-ink">PICK</span></span>
        <nav class="hidden sm:flex gap-6 text-[14px] font-semibold text-black/60">
          <a class="text-ink" href="#">PRODUCTS</a><a href="#">CONTACT</a>
        </nav>
      </div>
      <div class="flex items-center gap-3 text-[13px]">
        <button class="text-black/50">🔍</button>
        <button class="text-black/50">🛒</button>
        <button class="px-3 py-1.5 rounded-lg bg-brand text-white font-semibold">로그인</button>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-5 py-8">
    <p class="text-[12px] font-bold text-brand tracking-wide">BLEND PICK SHOP</p>
    <h1 class="text-3xl font-extrabold mt-1">Products</h1>
    <div class="w-10 h-1 bg-brand rounded mt-3"></div>

    <!-- 카테고리 필터 -->
    <div class="flex gap-2 mt-6 overflow-x-auto pb-1">
      <template x-for="c in ['전체','뷰티','식품','패션','디지털','생활용품']" :key="c">
        <button @click="cat=c" class="px-4 py-1.5 rounded-full text-[13px] font-semibold whitespace-nowrap transition"
          :class="cat===c?'bg-brand text-white':'bg-black/5 text-black/60'" x-text="c"></button>
      </template>
    </div>

    <!-- 상품 그리드 -->
    <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-x-5 gap-y-8 mt-8">
      <template x-for="p in [
        {n:'미니옥수수 x 클래식농원',b:'클래식농원',pr:'2,900',o:'3,500',d:'17',s:'배송비 3,000원',img:'https://shop-phinf.pstatic.net/20260224_291/1771908482234RHd76_PNG/1.png?type=w848'},
        {n:'스텐 보온 텀블러 500ml',b:'에코웨어',pr:'19,800',o:'29,000',d:'32',s:'배송비 3,000원',img:''},
        {n:'유기농 그래놀라 오리지널 500g',b:'그린팜',pr:'12,900',o:'18,000',d:'28',s:'배송비 2,500원',img:''},
        {n:'액티브 노이즈캔슬링 무선 이어폰',b:'사운드웨이브',pr:'79,000',o:'120,000',d:'34',s:'무료배송',img:''},
        {n:'오버핏 반팔 티셔츠',b:'모던웨어',pr:'22,000',o:'34,000',d:'35',s:'무료배송',img:''},
        {n:'딥 수분 크림 세트',b:'스킨로직',pr:'34,000',o:'52,000',d:'34',s:'무료배송',img:''},
        {n:'미니 에어프라이어 3.5L',b:'쿠킹플러스',pr:'59,000',o:'89,000',d:'33',s:'무료배송',img:''},
        {n:'유기농 비타민C 1000mg',b:'헬스케어랩',pr:'18,900',o:'28,000',d:'32',s:'배송비 2,500원',img:''}
      ]" :key="p.n">
        <a href="05_product-detail.html" class="group block">
          <div class="relative aspect-square rounded-xl overflow-hidden bg-neutral-100">
            <template x-if="p.img"><img :src="p.img" class="w-full h-full object-cover group-hover:scale-105 transition"></template>
            <template x-if="!p.img"><div class="w-full h-full flex items-center justify-center text-black/20 text-sm">이미지 없음</div></template>
            <span class="absolute top-2 left-2 bg-accent text-white text-[11px] font-bold px-2 py-0.5 rounded-md" x-text="'-'+p.d+'%'"></span>
          </div>
          <p class="text-[11px] text-black/45 mt-2" x-text="p.b"></p>
          <p class="text-[13px] font-semibold leading-snug mt-0.5" x-text="p.n"></p>
          <div class="flex items-baseline gap-1.5 mt-1">
            <span class="text-[15px] font-extrabold" x-text="p.pr+'원'"></span>
            <span class="text-[12px] text-black/30 line-through" x-text="p.o+'원'"></span>
          </div>
          <p class="text-[11px] text-black/45 mt-0.5" x-text="p.s"></p>
        </a>
      </template>
    </div>
  </main>
</div>
</body>
</html>
