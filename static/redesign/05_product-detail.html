<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>상품 상세 시안 · BLEND PICK</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<style>body{font-family:'Pretendard',sans-serif;}[x-cloak]{display:none;}</style>
<script>tailwind.config={theme:{extend:{colors:{brand:{DEFAULT:'#2f5d3f',dark:'#244a32',light:'#e7f0ea'},accent:'#ff7a1a',ink:'#1b1f1d',paper:'#faf9f5'}}}}</script>
</head>
<!-- 시안 05 — 메인샵 상품 상세 · 데스크탑 2단 / 모바일 스택 -->
<body class="bg-white text-ink">
  <header class="sticky top-0 z-30 bg-white/90 backdrop-blur border-b border-black/5">
    <div class="max-w-5xl mx-auto flex items-center px-5 h-14">
      <span class="font-extrabold tracking-tight text-brand text-lg">BLEND<span class="text-ink">PICK</span></span>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-5 py-6" x-data="{
      opts:[{n:'미니 옥수수 1개',p:2900},{n:'미니 옥수수 3개',p:5800},{n:'미니 옥수수 5개',p:7500}],
      sel:null, qty:1, get total(){return this.sel===null?0:this.opts[this.sel].p*this.qty}}">
    <!-- 브레드크럼 -->
    <p class="text-[12px] text-black/45 mb-4">Products <span class="mx-1">›</span> 식품 <span class="mx-1">›</span> 미니옥수수 x 클래식농원</p>

    <div class="grid md:grid-cols-2 gap-8">
      <!-- 이미지 -->
      <div>
        <div class="relative aspect-square rounded-2xl overflow-hidden bg-neutral-100">
          <img src="https://shop-phinf.pstatic.net/20260224_291/1771908482234RHd76_PNG/1.png?type=w848" class="w-full h-full object-cover">
          <span class="absolute top-3 left-3 bg-brand text-white text-[13px] font-bold px-2.5 py-1 rounded-lg">-17%</span>
        </div>
      </div>

      <!-- 정보 -->
      <div>
        <p class="text-[12px] text-black/50 font-medium">클래식농원</p>
        <h1 class="text-[22px] font-extrabold mt-1">미니옥수수 x 클래식농원</h1>
        <div class="flex items-baseline gap-2 mt-4 pb-4 border-b border-black/10">
          <span class="text-[26px] font-extrabold">2,900원</span>
          <span class="text-[15px] text-black/35 line-through">3,500원</span>
        </div>
        <p class="text-[13px] text-black/55 py-4 border-b border-black/10">배송비 3,000원</p>

        <!-- 옵션 -->
        <p class="text-[13px] font-bold mt-5 mb-2">옵션 선택</p>
        <div class="space-y-2">
          <template x-for="(o,i) in opts" :key="i">
            <button @click="sel=i" class="w-full flex items-center justify-between px-4 py-3 rounded-xl border text-[14px] transition"
              :class="sel===i?'border-brand bg-brand-light font-bold':'border-black/10'">
              <span x-text="o.n"></span><span class="text-brand font-semibold" x-text="'+'+o.p.toLocaleString()+'원'"></span>
            </button>
          </template>
        </div>

        <div class="flex items-center justify-between mt-5">
          <span class="text-[13px] font-bold">수량</span>
          <div class="flex items-center gap-3">
            <button @click="qty=Math.max(1,qty-1)" class="w-8 h-8 rounded-lg border border-black/15 text-lg leading-none">−</button>
            <span class="w-6 text-center font-bold" x-text="qty"></span>
            <button @click="qty++" class="w-8 h-8 rounded-lg border border-black/15 text-lg leading-none">+</button>
          </div>
        </div>

        <div class="flex items-center justify-between mt-4 mb-4" x-show="sel!==null" x-cloak>
          <span class="text-[13px] text-black/55">총 상품금액</span>
          <span class="text-[20px] font-extrabold text-brand" x-text="total.toLocaleString()+'원'"></span>
        </div>

        <div class="flex gap-2 mt-4">
          <button class="flex-1 py-3.5 rounded-xl border border-brand text-brand font-bold">장바구니</button>
          <button class="flex-[1.4] py-3.5 rounded-xl bg-brand text-white font-bold disabled:opacity-40"
            :disabled="sel===null" x-text="sel===null?'옵션을 선택해주세요':'바로 구매'"></button>
        </div>
      </div>
    </div>

    <!-- 리뷰 -->
    <section class="mt-12">
      <h2 class="text-lg font-extrabold mb-3">리뷰</h2>
      <div class="rounded-xl bg-neutral-50 border border-black/5 py-16 text-center text-black/40 text-sm">아직 리뷰가 없습니다</div>
    </section>

    <!-- 배송안내 -->
    <section class="mt-10 border-t border-black/10 pt-6 text-[13px] text-black/60 leading-relaxed">
      <h3 class="font-bold text-ink mb-2">배송 · 교환 · 환불 안내</h3>
      <p><b class="text-ink/80">배송</b> — 택배 · 전국 · 결제 확인 후 3~7일 내 출고 · 산간/도서 추가 배송비 발생 가능</p>
    </section>
  </main>
</body>
</html>
