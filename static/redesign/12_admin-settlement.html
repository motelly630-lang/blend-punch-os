    <!-- 요약 -->
    <div class="grid grid-cols-4 gap-4">
      <div class="bg-white rounded-xl border border-black/5 p-5"><p class="text-[12px] text-black/45">오늘</p><p class="text-2xl font-extrabold mt-1">0원</p></div>
      <div class="bg-white rounded-xl border border-black/5 p-5"><p class="text-[12px] text-black/45">이번 주</p><p class="text-2xl font-extrabold mt-1">0원</p></div>

    <div class="flex gap-2 mt-6 text-[13px] font-semibold">

      <button class="px-4 py-1.5 rounded-full bg-white border border-black/10 text-black/55">오늘</button>

      <button class="px-4 py-1.5 rounded-full bg-white border border-black/10 text-black/55">이번 달</button>

    <!-- 정산 내역 -->
    <div class="bg-white rounded-2xl border border-black/5 mt-4 overflow-hidden">
      <table class="w-full text-[13px]">
        <thead class="bg-black/[0.02] text-black/45 text-left">
          <tr><th class="px-5 py-3 font-semibold">정산일</th><th class="font-semibold">주문번호</th><th class="font-semibold">구매자</th><th class="font-semibold text-right">총액</th><th class="font-semibold text-right">수수료</th><th class="font-semibold text-right pr-5">정산액</th></tr>
        </thead>
        <tbody class="divide-y divide-black/5">
          <script>
            const s=[['2026. 6. 16.','BP-20260611-1LV27B','정우성','28,300원','-1,027원','27,273원'],
              ['2026. 6. 6.','BP-20260603-BCCDEX','한소희','37,800원','-1,247원','36,553원'],

            document.write(s.map(r=>`<tr class="hover:bg-black/[0.015]">
              <td class="px-5 py-3 text-black/55">${r[0]}</td><td class="text-black/70">${r[1]}</td><td class="font-semibold">${r[2]}</td>
              <td class="text-right">${r[3]}</td><td class="text-right text-red-500">${r[4]}</td><td class="text-right pr-5 font-bold">${r[5]}</td></tr>`).join(''));
          </script>
        </tbody>
      </table>
    </div>
