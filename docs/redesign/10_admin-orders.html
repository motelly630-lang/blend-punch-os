<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>관리자 판매관리 시안 · BLEND PICK</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<style>body{font-family:'Pretendard',sans-serif;}</style>
<script>tailwind.config={theme:{extend:{colors:{brand:{DEFAULT:'#2f5d3f',dark:'#244a32',light:'#e7f0ea'},accent:'#ff7a1a',ink:'#1b1f1d'}}}}</script>
</head>
<!-- 시안 10 — 관리자 판매 관리 (주문) -->
<body class="bg-[#f4f5f7] text-ink">
<div class="flex min-h-screen">
  <aside class="w-56 bg-white border-r border-black/5 flex flex-col shrink-0">
    <div class="px-5 py-5 border-b border-black/5"><p class="text-[11px] text-black/40 font-semibold">BLEND PICK</p><p class="font-extrabold text-lg">Admin</p></div>
    <nav class="p-3 space-y-1 text-[14px]">
      <a href="07_admin-dashboard.html" class="flex gap-3 px-3 py-2.5 rounded-lg text-black/60 hover:bg-black/5">📊 대시보드</a>
      <a href="08_admin-products.html" class="flex gap-3 px-3 py-2.5 rounded-lg text-black/60 hover:bg-black/5">📦 상품 관리</a>
      <a href="10_admin-orders.html" class="flex gap-3 px-3 py-2.5 rounded-lg bg-brand-light text-brand font-bold border-l-2 border-brand">🧾 판매 관리</a>
      <a href="11_admin-shipping.html" class="flex gap-3 px-3 py-2.5 rounded-lg text-black/60 hover:bg-black/5">🚚 배송 관리</a>
      <a href="12_admin-settlement.html" class="flex gap-3 px-3 py-2.5 rounded-lg text-black/60 hover:bg-black/5">💰 정산 관리</a>
      <a href="#" class="flex gap-3 px-3 py-2.5 rounded-lg text-black/60 hover:bg-black/5">⭐ 리뷰 관리</a>
    </nav>
  </aside>

  <main class="flex-1 p-8">
    <h1 class="text-2xl font-extrabold mb-6">판매 관리</h1>
    <!-- 상태 요약 -->
    <div class="grid grid-cols-4 gap-4">
      <div class="bg-white rounded-xl border border-black/5 p-5"><p class="text-[12px] text-black/45">신규주문</p><p class="text-2xl font-extrabold mt-1">3건</p></div>
      <div class="bg-white rounded-xl border border-black/5 p-5"><p class="text-[12px] text-black/45">주문확인</p><p class="text-2xl font-extrabold mt-1">0건</p></div>
      <div class="bg-white rounded-xl border border-black/5 p-5"><p class="text-[12px] text-black/45">배송준비</p><p class="text-2xl font-extrabold mt-1">6건</p></div>
      <div class="bg-white rounded-xl border border-black/5 p-5"><p class="text-[12px] text-black/45">배송완료</p><p class="text-2xl font-extrabold mt-1">4건</p></div>
    </div>

    <!-- 탭 -->
    <div class="flex gap-2 mt-6 text-[13px] font-semibold">
      <button class="px-4 py-1.5 rounded-full bg-ink text-white">전체 16</button>
      <button class="px-4 py-1.5 rounded-full bg-white border border-black/10 text-black/55">신규주문 3</button>
      <button class="px-4 py-1.5 rounded-full bg-white border border-black/10 text-black/55">주문확인</button>
      <button class="px-4 py-1.5 rounded-full bg-white border border-black/10 text-black/55">배송준비 6</button>
      <button class="px-4 py-1.5 rounded-full bg-white border border-black/10 text-black/55">배송완료 4</button>
    </div>

    <!-- 주문 목록 (상품별 묶음) -->
    <div class="bg-white rounded-2xl border border-black/5 mt-4 divide-y divide-black/5">
      <script>
        const orders=[['P008','스텐 보온 텀블러 500ml','3건'],['P006','유기농 그래놀라 오리지널 500g','2건'],
          ['P001','유기농 비타민C 1000mg 3개월분','2건'],['P003','미니 에어프라이어 3.5L','2건'],
          ['P002','딥 수분 크림 세트 (50ml+30ml)','2건'],['P004','오버핏 반팔 티셔츠','2건'],
          ['P005','액티브 노이즈캔슬링 무선 이어폰','2건'],['P007','히알루론산 고농축 앰플 30ml','1건']];
        document.write(orders.map(o=>`<div class="flex items-center gap-3 px-5 py-3.5 hover:bg-black/[0.015] text-[14px]">
          <input type="checkbox" class="w-4 h-4 accent-[#2f5d3f]">
          <span class="text-accent font-bold text-[12px] w-10">${o[0]}</span>
          <span class="font-semibold">${o[1]}</span><span class="text-black/40 text-[12px]">${o[2]}</span>
          <span class="ml-auto text-black/30">▾</span></div>`).join(''));
      </script>
    </div>
  </main>
</div>
</body>
</html>
