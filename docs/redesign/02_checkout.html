<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>주문/결제 시안 · BLEND PICK</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<style>body{font-family:'Pretendard',sans-serif;} [x-cloak]{display:none;}</style>
<script>
  tailwind.config={theme:{extend:{colors:{
    brand:{DEFAULT:'#2f5d3f',dark:'#244a32',light:'#e7f0ea'},accent:'#ff7a1a',ink:'#1b1f1d',paper:'#faf9f5'}}}}
</script>
</head>
<!-- 시안 02 — 주문/결제 (공구 참여하기 → 이 화면) -->
<body class="bg-paper text-ink">
<div class="mx-auto max-w-[440px] bg-white min-h-screen shadow-sm relative pb-32"
     x-data="{pay:'card', agree:false}">

  <header class="sticky top-0 z-30 flex items-center gap-2 px-4 h-12 bg-white/95 backdrop-blur border-b border-black/5">
    <button class="text-xl leading-none">‹</button>
    <span class="font-bold">주문 / 결제</span>
  </header>

  <!-- 배송지 -->
  <section class="px-4 py-4 border-b-8 border-neutral-100">
    <p class="text-[13px] font-extrabold mb-3">배송지</p>
    <div class="space-y-2">
      <input class="w-full px-3.5 py-3 rounded-xl border border-black/10 text-[14px]" placeholder="받는 분 성함">
      <input class="w-full px-3.5 py-3 rounded-xl border border-black/10 text-[14px]" placeholder="연락처">
      <div class="flex gap-2">
        <input class="flex-1 px-3.5 py-3 rounded-xl border border-black/10 text-[14px]" placeholder="우편번호" readonly>
        <button class="px-4 rounded-xl border border-brand text-brand font-semibold text-[13px]">주소 검색</button>
      </div>
      <input class="w-full px-3.5 py-3 rounded-xl border border-black/10 text-[14px]" placeholder="상세주소">
      <input class="w-full px-3.5 py-3 rounded-xl border border-black/10 text-[14px]" placeholder="배송 요청사항 (선택)">
    </div>
  </section>

  <!-- 주문 상품 -->
  <section class="px-4 py-4 border-b-8 border-neutral-100">
    <p class="text-[13px] font-extrabold mb-3">주문 상품</p>
    <div class="flex gap-3">
      <img src="https://shop-phinf.pstatic.net/20260224_291/1771908482234RHd76_PNG/1.png?type=w848" class="w-16 h-16 rounded-lg object-cover">
      <div class="flex-1 text-[13px]">
        <p class="text-black/50">클래식농원</p>
        <p class="font-bold">미니옥수수 x 클래식농원</p>
        <p class="text-black/55 mt-0.5">미니 옥수수 3개 / 수량 1개</p>
        <p class="font-extrabold text-brand mt-1">5,800원</p>
      </div>
    </div>
  </section>

  <!-- 결제수단 -->
  <section class="px-4 py-4 border-b-8 border-neutral-100">
    <p class="text-[13px] font-extrabold mb-3">결제 수단</p>
    <div class="grid grid-cols-3 gap-2">
      <template x-for="m in [{k:'card',t:'카드'},{k:'kakao',t:'카카오페이'},{k:'toss',t:'토스페이'}]" :key="m.k">
        <button @click="pay=m.k" class="py-3 rounded-xl border text-[13px] font-semibold transition"
          :class="pay===m.k?'border-brand bg-brand-light':'border-black/10 text-black/60'" x-text="m.t"></button>
      </template>
    </div>
  </section>

  <!-- 금액 요약 -->
  <section class="px-4 py-4">
    <p class="text-[13px] font-extrabold mb-3">결제 금액</p>
    <div class="space-y-2 text-[13px]">
      <div class="flex justify-between"><span class="text-black/55">상품금액</span><span>5,800원</span></div>
      <div class="flex justify-between"><span class="text-black/55">배송비</span><span>3,000원</span></div>
      <div class="flex justify-between text-brand"><span>공구 할인</span><span>-600원</span></div>
      <div class="flex justify-between pt-2 border-t border-black/10 text-[16px] font-extrabold">
        <span>총 결제금액</span><span class="text-brand">8,200원</span></div>
    </div>
  </section>

  <!-- 동의 + 결제 (하단 고정) -->
  <div class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[440px] bg-white border-t border-black/10 px-4 py-3 z-40">
    <label class="flex items-center gap-2 mb-2.5 text-[12px] text-black/60">
      <input type="checkbox" x-model="agree" class="w-4 h-4 accent-[#2f5d3f]">
      주문 내용을 확인했으며 결제에 동의합니다 (필수)
    </label>
    <button class="w-full py-3.5 rounded-xl bg-brand text-white font-bold text-[15px] disabled:opacity-40" :disabled="!agree">
      8,200원 결제하기
    </button>
  </div>
</div>
</body>
</html>
