<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A4 예약 관리 · BLEND PICK Admin</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<style>body{font-family:'Pretendard',sans-serif;}</style>
<script>tailwind.config={theme:{extend:{colors:{brand:{DEFAULT:'#2f5d3f',dark:'#244a32',light:'#e7f0ea'},accent:'#ff7a1a',ink:'#1b1f1d'}}}}</script>
</head>
<!-- A4 — 호텔 예약 관리 -->
<body class="bg-[#f4f5f7] text-ink">
<div class="flex min-h-screen">
  <aside class="w-56 bg-white border-r border-black/5 shrink-0">
    <div class="px-5 py-5 border-b border-black/5"><p class="text-[11px] text-black/40 font-semibold">BLEND PICK</p><p class="font-extrabold text-lg">Admin</p></div>
    <nav class="p-3 space-y-1 text-[14px]">
      <a href="07_admin-dashboard.html" class="flex gap-3 px-3 py-2.5 rounded-lg text-black/60 hover:bg-black/5">📊 대시보드</a>
      <a href="08_admin-products.html" class="flex gap-3 px-3 py-2.5 rounded-lg text-black/60 hover:bg-black/5">📦 상품 관리</a>
      <a href="10_admin-orders.html" class="flex gap-3 px-3 py-2.5 rounded-lg text-black/60 hover:bg-black/5">🧾 판매 관리</a>
      <a href="ha05_reservations.html" class="flex gap-3 px-3 py-2.5 rounded-lg bg-brand-light text-brand font-bold border-l-2 border-brand">🏨 예약 관리</a>
      <a href="12_admin-settlement.html" class="flex gap-3 px-3 py-2.5 rounded-lg text-black/60 hover:bg-black/5">💰 정산 관리</a>
    </nav>
  </aside>

  <main class="flex-1 p-8">
    <h1 class="text-2xl font-extrabold mb-6">호텔 예약 관리</h1>

    <!-- 요약 -->
    <div class="grid grid-cols-4 gap-4">
      <div class="bg-white rounded-xl border border-black/5 p-5"><p class="text-[12px] text-black/45">예약 확정</p><p class="text-2xl font-extrabold mt-1">24건</p></div>
      <div class="bg-white rounded-xl border border-black/5 p-5"><p class="text-[12px] text-black/45">체크인 예정</p><p class="text-2xl font-extrabold mt-1">7건</p></div>
      <div class="bg-white rounded-xl border border-black/5 p-5"><p class="text-[12px] text-black/45">취소</p><p class="text-2xl font-extrabold mt-1">2건</p></div>
      <div class="bg-brand text-white rounded-xl p-5"><p class="text-[12px] text-white/70">예약 매출</p><p class="text-2xl font-extrabold mt-1">6,192,000원</p></div>
    </div>

    <!-- 탭 + 검색 -->
    <div class="flex items-center justify-between mt-6">
      <div class="flex gap-2 text-[13px] font-semibold">
        <button class="px-4 py-1.5 rounded-full bg-ink text-white">전체</button>
        <button class="px-4 py-1.5 rounded-full bg-white border border-black/10 text-black/55">예약확정</button>
        <button class="px-4 py-1.5 rounded-full bg-white border border-black/10 text-black/55">체크인완료</button>
        <button class="px-4 py-1.5 rounded-full bg-white border border-black/10 text-black/55">취소</button>
        <button class="px-4 py-1.5 rounded-full bg-white border border-black/10 text-black/55">노쇼</button>
      </div>
      <input class="px-3 py-2 rounded-lg border border-black/10 text-[13px] w-56" placeholder="🔍 예약번호·예약자 검색">
    </div>

    <!-- 예약 테이블 -->
    <div class="bg-white rounded-2xl border border-black/5 mt-4 overflow-x-auto">
      <table class="w-full text-[13px] whitespace-nowrap">
        <thead class="bg-black/[0.02] text-black/45 text-left">
          <tr><th class="px-5 py-3 font-semibold">예약번호</th><th class="font-semibold">예약자</th><th class="font-semibold">호텔 · 객실</th><th class="font-semibold">체크인 ~ 아웃</th><th class="font-semibold">박·인원</th><th class="font-semibold text-right">금액</th><th class="font-semibold">상태</th></tr>
        </thead>
        <tbody class="divide-y divide-black/5">
          <script>
            const s=[
              ['BP-H-20260702-K3M9','오유나 / 010-1231-1231','그랜드 오션 리조트 · 디럭스 오션뷰','8/1 ~ 8/3','2박·성인2','258,000원','예약확정','brand'],
              ['BP-H-20260701-A7X2','김도현 / 010-2341-5678','그랜드 오션 리조트 · 프리미어 스위트','8/5 ~ 8/6','1박·성인2/아동1','239,000원','예약확정','brand'],
              ['BP-H-20260630-Q1W2','이서연 / 010-9012-3456','그랜드 오션 리조트 · 디럭스 오션뷰','7/28 ~ 7/30','2박·성인2','258,000원','체크인완료','gray'],
              ['BP-H-20260628-Z9Y8','박지호 / 010-2345-6789','그랜드 오션 리조트 · 스탠다드 트윈','8/10 ~ 8/12','2박·성인2','198,000원','예약확정','brand'],
              ['BP-H-20260625-M4N5','최유진 / 010-8901-2345','그랜드 오션 리조트 · 프리미어 스위트','7/20 ~ 7/21','1박·성인2','219,000원','취소','red']];
            const badge={brand:'bg-brand-light text-brand',gray:'bg-black/10 text-black/50',red:'bg-red-100 text-red-500'};
            document.write(s.map(r=>`<tr class="hover:bg-black/[0.015]">
              <td class="px-5 py-3 text-brand font-semibold">${r[0]}</td>
              <td>${r[1]}</td><td class="text-black/70">${r[2]}</td><td>${r[3]}</td><td class="text-black/55">${r[4]}</td>
              <td class="text-right font-bold">${r[5]}</td>
              <td><span class="px-2 py-0.5 rounded-full text-[12px] font-semibold ${badge[r[7]]}">${r[6]}</span></td></tr>`).join(''));
          </script>
        </tbody>
      </table>
    </div>
  </main>
</div>
</body>
</html>
