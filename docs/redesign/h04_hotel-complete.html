<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>H04 예약 완료 · BLEND PICK</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<style>body{font-family:'Pretendard',sans-serif;}</style>
<script>tailwind.config={theme:{extend:{colors:{brand:{DEFAULT:'#2f5d3f',dark:'#244a32',light:'#e7f0ea'},accent:'#ff7a1a',ink:'#1b1f1d',paper:'#faf9f5'}}}}</script>
</head>
<!-- H04 — 예약 완료 (바우처형) -->
<body class="bg-neutral-100 text-ink py-6">
<div class="mx-auto max-w-[440px] bg-white min-h-[80vh] rounded-2xl shadow-sm overflow-hidden">
  <div class="px-6 py-10 text-center">
    <div class="w-16 h-16 mx-auto rounded-full bg-brand-light flex items-center justify-center text-3xl">🏨</div>
    <h1 class="text-[20px] font-extrabold mt-5">예약이 확정됐어요!</h1>
    <p class="text-[13px] text-black/55 mt-2">예약번호 <b class="text-ink">BP-H-20260702-K3M9</b></p>
  </div>

  <!-- 바우처 -->
  <div class="mx-6 rounded-2xl border-2 border-dashed border-brand/30 overflow-hidden">
    <img src="https://images.unsplash.com/photo-1566073771259-6a8506099945?w=600" class="w-full h-32 object-cover">
    <div class="p-5 text-[13px]">
      <p class="text-[11px] text-black/45">5성급 · 제주 서귀포</p>
      <p class="text-[16px] font-extrabold">그랜드 오션 리조트 제주</p>
      <div class="mt-3 grid grid-cols-3 text-center border-t border-black/8 pt-3">
        <div><p class="text-[11px] text-black/45">체크인</p><p class="font-bold">8/1 (금)</p></div>
        <div><p class="text-[11px] text-black/45">체크아웃</p><p class="font-bold">8/3 (일)</p></div>
        <div><p class="text-[11px] text-black/45">객실</p><p class="font-bold">디럭스 오션뷰</p></div>
      </div>
      <div class="mt-3 flex justify-between border-t border-black/8 pt-3"><span class="text-black/55">결제금액</span><span class="font-extrabold text-brand">258,000원</span></div>
    </div>
  </div>

  <div class="px-6 mt-5 text-[12px] text-black/50 text-center">📩 예약 확인서를 카카오톡으로 보내드렸어요<br>체크인 시 예약자 성함으로 확인됩니다</div>

  <div class="px-6 mt-6 pb-8 space-y-2">
    <button class="w-full py-3.5 rounded-xl bg-brand text-white font-bold">예약 상세 보기</button>
    <button class="w-full py-3.5 rounded-xl border border-black/10 font-bold text-black/60">예약 내역으로</button>
  </div>
</div>
</body>
</html>
