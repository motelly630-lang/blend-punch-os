<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A2 객실 등록 · BLEND PICK Admin</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<style>body{font-family:'Pretendard',sans-serif;}
  .fld{width:100%;padding:.6rem .8rem;border:1px solid rgba(0,0,0,.1);border-radius:.6rem;font-size:14px;}
  .lbl{font-size:12px;font-weight:600;color:rgba(0,0,0,.55);margin-bottom:.3rem;display:block;}</style>
<script>tailwind.config={theme:{extend:{colors:{brand:{DEFAULT:'#2f5d3f',dark:'#244a32',light:'#e7f0ea'},accent:'#ff7a1a',ink:'#1b1f1d'}}}}</script>
</head>
<!-- A2 — 객실 등록 (호텔 전용 폼 2/4) -->
<body class="bg-[#f4f5f7] text-ink">
<div class="flex min-h-screen">
  <aside class="w-56 bg-white border-r border-black/5 shrink-0">
    <div class="px-5 py-5 border-b border-black/5"><p class="text-[11px] text-black/40 font-semibold">BLEND PICK</p><p class="font-extrabold text-lg">Admin</p></div>
    <nav class="p-3 space-y-1 text-[14px]">
      <a href="07_admin-dashboard.html" class="flex gap-3 px-3 py-2.5 rounded-lg text-black/60 hover:bg-black/5">📊 대시보드</a>
      <a href="08_admin-products.html" class="flex gap-3 px-3 py-2.5 rounded-lg bg-brand-light text-brand font-bold border-l-2 border-brand">📦 상품 관리</a>
      <a href="10_admin-orders.html" class="flex gap-3 px-3 py-2.5 rounded-lg text-black/60 hover:bg-black/5">🧾 판매 관리</a>
      <a href="ha05_reservations.html" class="flex gap-3 px-3 py-2.5 rounded-lg text-black/60 hover:bg-black/5">🏨 예약 관리</a>
      <a href="12_admin-settlement.html" class="flex gap-3 px-3 py-2.5 rounded-lg text-black/60 hover:bg-black/5">💰 정산 관리</a>
    </nav>
  </aside>

  <main class="flex-1 p-8 max-w-3xl">
    <div class="flex items-center gap-2">🏨 <h1 class="text-2xl font-extrabold">호텔 등록</h1><span class="text-[11px] font-bold text-white bg-accent px-2 py-0.5 rounded-full">호텔 공동구매</span></div>
    <div class="flex gap-2 mt-5 text-[12px] font-semibold">
      <span class="px-3 py-1.5 rounded-full bg-brand-light text-brand">1. 호텔 정보</span>
      <span class="px-3 py-1.5 rounded-full bg-brand text-white">2. 객실 등록</span>
      <span class="px-3 py-1.5 rounded-full bg-black/5 text-black/45">3. 날짜별 가격·잔여</span>
      <span class="px-3 py-1.5 rounded-full bg-black/5 text-black/45">4. 확인</span>
    </div>

    <p class="text-[13px] text-black/50 mt-6">객실 타입을 추가하세요. (가격·잔여는 다음 단계에서 날짜별로 설정)</p>

    <!-- 등록된 객실 목록 -->
    <div class="space-y-3 mt-4">
      <div class="bg-white rounded-2xl border border-black/5 p-5 flex gap-4">
        <div class="w-24 h-24 rounded-xl bg-neutral-100 flex items-center justify-center text-black/25 text-2xl shrink-0">🖼</div>
        <div class="flex-1">
          <div class="flex justify-between"><p class="font-extrabold">디럭스 오션뷰</p><button class="text-black/35 text-[13px]">삭제</button></div>
          <div class="grid grid-cols-4 gap-2 mt-2 text-[12px] text-black/55">
            <div>기준 <b class="text-ink">2인</b></div><div>최대 <b class="text-ink">3인</b></div><div>침대 <b class="text-ink">더블1</b></div><div>추가인원 <b class="text-ink">2만/인</b></div>
          </div>
        </div>
      </div>
      <div class="bg-white rounded-2xl border border-black/5 p-5 flex gap-4">
        <div class="w-24 h-24 rounded-xl bg-neutral-100 flex items-center justify-center text-black/25 text-2xl shrink-0">🖼</div>
        <div class="flex-1">
          <div class="flex justify-between"><p class="font-extrabold">프리미어 스위트</p><button class="text-black/35 text-[13px]">삭제</button></div>
          <div class="grid grid-cols-4 gap-2 mt-2 text-[12px] text-black/55">
            <div>기준 <b class="text-ink">2인</b></div><div>최대 <b class="text-ink">4인</b></div><div>침대 <b class="text-ink">킹1</b></div><div>추가인원 <b class="text-ink">3만/인</b></div>
          </div>
        </div>
      </div>
    </div>

    <!-- 새 객실 추가 폼 -->
    <div class="bg-white rounded-2xl border-2 border-dashed border-brand/30 p-6 mt-3">
      <p class="text-[13px] font-extrabold text-brand mb-4">+ 새 객실 타입 추가</p>
      <div class="grid grid-cols-2 gap-4">
        <div class="col-span-2"><label class="lbl">객실명</label><input class="fld" placeholder="예: 스탠다드 트윈"></div>
        <div><label class="lbl">기준 인원</label><input type="number" class="fld" value="2"></div>
        <div><label class="lbl">최대 인원</label><input type="number" class="fld" value="2"></div>
        <div><label class="lbl">침대 타입</label><input class="fld" placeholder="예: 트윈 2"></div>
        <div><label class="lbl">추가 인원 요금 (원/인)</label><input type="number" class="fld" value="20000"></div>
      </div>
      <div class="mt-4"><label class="lbl">객실 이미지</label>
        <div class="border-2 border-dashed border-black/15 rounded-xl h-24 flex items-center justify-center text-black/25 text-2xl">+</div></div>
      <button class="w-full mt-4 py-2.5 rounded-xl bg-brand-light text-brand font-bold text-[14px]">이 객실 추가</button>
    </div>

    <div class="flex justify-between mt-6 pb-10">
      <a href="ha02_hotel-info.html" class="px-6 py-3 rounded-xl border border-black/10 bg-white font-bold text-[14px]">← 이전</a>
      <a href="ha04_rate-inventory.html" class="px-6 py-3 rounded-xl bg-brand text-white font-bold text-[14px]">다음: 날짜별 가격·잔여 →</a>
    </div>
  </main>
</div>
</body>
</html>
