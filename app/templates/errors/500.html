<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>서버 오류 | BLEND PUNCH OS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>body { font-family: 'Noto Sans KR', system-ui, sans-serif; }</style>
</head>
<body class="bg-gray-950 min-h-screen flex items-center justify-center p-4">
  <div class="text-center max-w-md w-full">
    <div class="text-8xl font-black text-gray-800 leading-none mb-2 select-none">500</div>
    <div class="w-16 h-16 mx-auto mb-6 rounded-2xl bg-red-950 flex items-center justify-center">
      <svg class="w-8 h-8 text-red-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z"/>
      </svg>
    </div>
    <h1 class="text-xl font-semibold text-gray-200 mb-2">서버 오류가 발생했습니다</h1>
    <p class="text-sm text-gray-500 mb-8 leading-relaxed">
      일시적인 문제입니다. 잠시 후 다시 시도해 주세요.<br>
      문제가 계속되면 관리자에게 문의하세요.
    </p>
    {% if error_id %}
    <div class="mb-6 px-4 py-2.5 bg-gray-900 rounded-lg border border-gray-800">
      <span class="text-xs text-gray-600">오류 ID: </span>
      <span class="text-xs font-mono text-gray-400">{{ error_id }}</span>
    </div>
    {% endif %}
    <div class="flex flex-col sm:flex-row items-center justify-center gap-3">
      <a href="/"
        class="w-full sm:w-auto inline-flex items-center justify-center gap-2 px-6 py-2.5 bg-blue-600 text-white text-sm font-medium rounded-xl hover:bg-blue-700 transition-colors">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
        </svg>
        대시보드로 이동
      </a>
      <button onclick="location.reload()"
        class="w-full sm:w-auto inline-flex items-center justify-center gap-2 px-6 py-2.5 bg-gray-800 text-gray-300 text-sm font-medium rounded-xl hover:bg-gray-700 transition-colors">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
        </svg>
        다시 시도
      </button>
    </div>
    <div class="mt-10 text-xs text-gray-700">BLEND PUNCH OS</div>
  </div>
</body>
</html>
