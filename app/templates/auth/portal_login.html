<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>협력사 로그인 | BLEND PUNCH</title>
  <link rel="icon" type="image/png" href="/static/logo.png">
  <link rel="stylesheet" href="/static/css/app.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="font-sans antialiased min-h-screen flex items-center justify-center bg-gray-900">
  <div class="w-full max-w-sm px-4">

    <!-- Logo -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center mb-4">
        <img src="/static/logo.png" alt="BLEND PUNCH"
             class="w-14 h-14 rounded-2xl object-contain shadow-sm bg-white p-1.5"
             onerror="this.style.display='none'; document.getElementById('p-logo-svg').style.display='flex'">
        <div id="p-logo-svg" style="display:none"
             class="w-14 h-14 bg-white rounded-2xl items-center justify-center shadow-lg">
          <svg class="w-7 h-7 text-gray-900" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/>
          </svg>
        </div>
      </div>
      <div class="text-xs font-bold tracking-widest uppercase text-white/60">BLEND PUNCH</div>
      <div class="font-bold text-lg mt-1 text-white">협력사 포털</div>
    </div>

    <!-- Card -->
    <div class="bg-white rounded-2xl shadow-lg border border-gray-100 p-8">
      <h1 class="text-base font-semibold text-gray-800 mb-1">협력사 로그인</h1>
      <p class="text-xs text-gray-400 mb-6">발급받은 협력사 계정으로 로그인하세요.</p>

      {% if error %}
      <div class="mb-4 flex items-center gap-2 bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg text-sm">
        <svg class="w-4 h-4 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/>
        </svg>
        {{ error }}
      </div>
      {% endif %}

      <form method="post" action="/portal/login" class="space-y-4">
        <div>
          <label for="username" class="block text-sm font-medium text-gray-700 mb-1.5">아이디</label>
          <input id="username" type="text" name="username" autocomplete="username" autofocus required
            class="w-full px-3.5 py-2.5 border border-gray-200 rounded-lg text-sm text-gray-900 placeholder-gray-400
                   focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition"
            placeholder="협력사 아이디">
        </div>
        <div>
          <label for="password" class="block text-sm font-medium text-gray-700 mb-1.5">비밀번호</label>
          <input id="password" type="password" name="password" autocomplete="current-password" required
            class="w-full px-3.5 py-2.5 border border-gray-200 rounded-lg text-sm text-gray-900 placeholder-gray-400
                   focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition"
            placeholder="비밀번호">
        </div>
        <button type="submit"
          class="w-full py-2.5 bg-indigo-600 text-white text-sm font-medium rounded-lg hover:bg-indigo-700 transition-colors mt-2">
          협력사 로그인
        </button>
      </form>

      {% if show_os_link %}
      <div class="mt-4 text-center text-sm">
        <a href="/login" class="text-indigo-600 hover:text-indigo-800 font-medium">내부 직원이신가요? OS 로그인 →</a>
      </div>
      {% endif %}
    </div>

    <div class="mt-5 text-center text-xs text-white/40">
      계정 문의는 담당 매니저에게 연락해주세요.
    </div>
  </div>
</body>
</html>
