{% extends "base.html" %}
{% block title %}CS 가이드 {% if guide %}수정{% else %}등록{% endif %} · BLEND PUNCH OS{% endblock %}
{% block page_title %}CS 가이드 {% if guide %}수정{% else %}등록{% endif %}{% endblock %}

{% block content %}
<form method="post" action="{% if guide %}/cs/guides/{{ guide.id }}/edit{% else %}/cs/guides/new{% endif %}" class="max-w-2xl space-y-4">
  <div class="bg-white border border-gray-100 rounded-xl p-5 space-y-4">
    <div>
      <label class="block text-xs font-medium text-gray-500 mb-1">적용 상품</label>
      <select name="product_id" class="w-full px-3 py-2 rounded-lg border border-gray-200 text-sm">
        <option value="">공통 (상품 미지정)</option>
        {% for p in products %}<option value="{{ p.id }}" {% if guide and guide.product_id == p.id %}selected{% endif %}>{{ p.name }}</option>{% endfor %}
      </select>
    </div>
    <div>
      <label class="block text-xs font-medium text-gray-500 mb-1">가이드 제목</label>
      <input type="text" name="title" required value="{{ guide.title if guide else '' }}" placeholder="예: 진공풀림" class="w-full px-3 py-2 rounded-lg border border-gray-200 text-sm">
    </div>
    <div>
      <label class="block text-xs font-medium text-gray-500 mb-1">내부용 내용 <span class="text-red-400">(협업사 미노출)</span></label>
      <textarea name="content_internal" rows="5" class="w-full px-3 py-2 rounded-lg border border-gray-200 text-sm">{{ guide.content_internal if guide else '' }}</textarea>
    </div>
    <div>
      <label class="block text-xs font-medium text-gray-500 mb-1">협업사 공개용 내용</label>
      <textarea name="content_partner" rows="4" class="w-full px-3 py-2 rounded-lg border border-gray-200 text-sm">{{ guide.content_partner if guide else '' }}</textarea>
    </div>
    <div class="flex items-center gap-4">
      <div>
        <label class="block text-xs font-medium text-gray-500 mb-1">정렬 순서</label>
        <input type="number" name="sort_order" value="{{ guide.sort_order if guide else 0 }}" class="w-28 px-3 py-2 rounded-lg border border-gray-200 text-sm">
      </div>
      {% if guide %}
      <label class="inline-flex items-center gap-2 text-sm text-gray-700 mt-5">
        <input type="checkbox" name="is_active" value="1" {% if guide.is_active %}checked{% endif %} class="rounded border-gray-300"> 활성
      </label>
      {% endif %}
    </div>
  </div>
  <div class="flex items-center gap-2">
    <button class="px-5 py-2.5 rounded-lg text-sm font-semibold text-white bg-blue-600 hover:bg-blue-700">저장</button>
    <a href="/cs/guides" class="px-4 py-2.5 rounded-lg text-sm text-gray-500 hover:text-gray-700">취소</a>
  </div>
</form>
{% endblock %}
